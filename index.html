<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>面白いボタン</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(circle at top, #f8f9ff, #eef2ff);
      }
      .card {
        text-align: center;
        padding: 2rem;
        border-radius: 14px;
        background: #ffffffcc;
        box-shadow: 0 10px 30px rgba(30, 41, 59, 0.1);
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
        background: #4f46e5;
        color: white;
      }
      #result {
        margin-top: 1rem;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome to the website generated by my demo repository</h1>
      <p>ボタンを押すと、今日の「面白い」が出ます。</p>
      <button id="fun-button" type="button">面白いことを出す</button>
      <p id="result" aria-live="polite">🤔 まだ真面目です</p>
    </main>

    <script>
      const lines = [
        "🐙 GitHub Copilot「了解です」→ 3秒後に哲学を語りだす",
        "🧪 テスト「私が落ちたのではない。期待値が高すぎるのだ」",
        "🚀 デプロイ成功！なお本番でだけ再現します",
        "🧠 今日の学び: semicolon は心の句読点",
        "✨ バグ0件（未発見）"
      ];

      document.getElementById("fun-button").addEventListener("click", () => {
        const pick = lines[Math.floor(Math.random() * lines.length)];
        document.getElementById("result").textContent = pick;
      });
    </script>
  </body>
</html>
